general_settings:
  alerting: []
  allow_client_side_credentials: true
  master_key: sk-sidecar-1

include:
- dynamic_models.yaml

litellm_settings:
  request_timeout: 1800
  additional_drop_params:
  - provider
  cache: true
  cache_params:
    ttl: 300
    type: local
  callbacks: frugallm.custom_callbacks.hermes_proxy_handler
  drop_params: true
  failure_callback:
  - langfuse
#  - postgres
#  - prometheus
  middleware:
  - frugallm.gatekeeper.GatekeeperMiddleware
  set_verbose: true
  success_callback:
  - langfuse
#  - postgres
#  - prometheus
model_list:
# ── Local Models ──
- litellm_params:
    api_base: http://100.80.59.45:8080/v1
    api_key: na
    extra_body:
      chat_template_kwargs:
        enable_thinking: true
        preserve_thinking: true
    max_retries: 0
    max_parallel_requests: 1
    model: openai//models/gemma-4-12b-it-Q5_K_M.gguf
    stop:
    - <turn|>
    - </s>
    - <eos>
    stream_timeout: 1800
    timeout: 1800
  model_info:
    input_cost_per_token: 0.0
    output_cost_per_token: 0.0
  model_name: gemma-4-12b-gguf
- litellm_params:
    api_base: http://host.docker.internal:11434
    max_retries: 0
    max_parallel_requests: 1
    model: ollama_chat/hermes:latest
    num_ctx: 32768
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
        preserve_thinking: false
    stream_timeout: 600
    timeout: 600
  model_info:
    input_cost_per_token: 0.0
    output_cost_per_token: 0.0
  model_name: hermes-latest-proxy

# ── Cloud Models ──
- litellm_params:
    api_key: os.environ/GOOGLE_API_KEY
    max_tokens: 8192
    model: gemini/gemini-3.6-flash
    reasoning_effort: high
    timeout: 600
  model_name: gemini-3.6-flash
- litellm_params:
    api_key: os.environ/GOOGLE_API_KEY
    max_tokens: 8192
    model: gemini/gemini-3.5-flash-lite
    timeout: 600
  model_name: gemini-flash-lite
- litellm_params:
    api_key: os.environ/GOOGLE_API_KEY
    max_tokens: 8192
    model: gemini/gemini-3.1-pro-preview
    reasoning_effort: high
    timeout: 600
  model_name: gemini-3.1-pro

# LiteLLM's include: mechanism OVERWRITES (not merges) router_settings,
# so defining them here would be silently dropped when the dynamic
# models file is loaded. See: 2026-07-22 thinker 503 incident.
